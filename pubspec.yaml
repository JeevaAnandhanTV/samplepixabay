name: infinite_image_gallery
description: Infinite image gallery powered by the Pixabay API (Flutter intermediate assignment).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  gal: ^2.3.1
  share_plus: ^10.1.4
  audioplayers: ^6.1.0
  flutter_tts: ^4.1.0
  url_launcher: ^6.3.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
